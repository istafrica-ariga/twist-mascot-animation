<!doctype html>
<meta charset="utf-8">
<title>Twist Hero Theme</title>
<!--
  A four-second superhero sting for the Twist splash.

  This is a deliberate restart, not another revision of launch_sound.html. Three earlier passes all
  failed the same way and no amount of retuning fixed them, because they shared one wrong premise:
  they were SOUND EFFECTS — six short taps triggered at animation beats, with silence in between.

  A splash does not want effects. It wants a sting: a tiny piece of music with a bassline, chords
  that move, and a tune you could hum, which happens to land its accents where the mascot moves.
  Netflix's two notes, the PlayStation chime, Duolingo's own path music — all composed phrases.

  So everything here is new:
    - a subtractive engine (oscillators → resonant filter with its own envelope → amp), instead of
      the additive sine stacks used before. Filter movement is what makes a note feel alive.
    - a continuous arrangement: bass and chords play THROUGH the clip, so there is no dead air.
    - a real cadence, I–IV–V–I in C, resolving exactly on the wordmark.
    - a melody with a shape: climb, hang, fall, resolve.

  Render with:  node tools/render_hero_theme.mjs
-->
<body style="background:#15052E;color:#fff;font:14px -apple-system,sans-serif;padding:24px">
<h1 style="font-size:18px;margin:0 0 12px">Twist — hero theme</h1>
<button id="play" style="font:inherit;padding:8px 16px">Play</button>
<pre id="log" style="color:#B9A6E8;font-size:12px"></pre>
<script>
const N = n => 440 * Math.pow(2, (n - 69) / 12);          // MIDI → Hz
const C2=36,E2=40,F2=41,G2=43,A2=45,C3=48,E3=52,F3=53,G3=55,A3=57,B3=59,
      C4=60,D4=62,E4=64,F4=65,G4=67,A4=69,B4=71,
      C5=72,D5=74,E5=76,F5=77,G5=79,A5=81,B5=83,C6=84,D6=86,E6=88,G6=91,C7=96,E7=100;

// ---------------------------------------------------------------------------
// Engine: subtractive. Oscillators through a resonant low-pass whose cutoff has
// its own envelope — that sweep is the difference between a note that sounds
// played and one that sounds generated.
// ---------------------------------------------------------------------------
function createEngine(ctx) {
  const out = ctx.createGain(); out.gain.value = 0.9;

  // Bus compressor, so the arrangement glues instead of spiking on each stab.
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3.5;
  comp.attack.value = 0.004; comp.release.value = 0.18;

  // A touch of air on top — nothing is duller than a sting with no high end.
  const shelf = ctx.createBiquadFilter();
  shelf.type = 'highshelf'; shelf.frequency.value = 3200; shelf.gain.value = 3;

  out.connect(comp); comp.connect(shelf); shelf.connect(ctx.destination);

  // Short plate-ish room. Kept tight: a splash sting should feel close, not distant.
  let sd = 1337;
  const rnd = () => (sd = (sd * 16807) % 2147483647, (sd - 1) / 2147483646);
  const ir = ctx.createBuffer(2, Math.round(ctx.sampleRate * 1.1), ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 2.6);
  }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = 0.16;
  verb.connect(wet); wet.connect(out);

  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }

  const chan = (pan, send) => {
    const g = ctx.createGain(); g.gain.value = 0;
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    g.connect(p); p.connect(out);
    if (send) { const s = ctx.createGain(); s.gain.value = send; p.connect(s); s.connect(verb); }
    return g;
  };

  /** One subtractive note.
   *  waves   : [[type, detuneCents, level], ...]
   *  cutoff  : [startHz, peakHz, endHz] — the filter envelope, the voice's character
   *  amp     : [attack, decay, sustainLevel, release] in seconds / 0-1
   */
  function play(t, freq, dur, {
    waves = [['sawtooth', 0, 1]], cutoff = [400, 4000, 700], q = 6,
    amp = [0.006, 0.08, 0.6, 0.25], gain = 0.2, pan = 0, send = 0.25, glideFrom = 0,
  } = {}) {
    const g = chan(pan, send);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.Q.value = q;
    f.frequency.setValueAtTime(cutoff[0], t);
    f.frequency.linearRampToValueAtTime(cutoff[1], t + Math.min(0.05, dur * 0.35));
    f.frequency.exponentialRampToValueAtTime(Math.max(80, cutoff[2]), t + dur);
    f.connect(g);

    for (const [type, cents, lvl] of waves) {
      const o = ctx.createOscillator();
      o.type = type;
      const base = freq * Math.pow(2, cents / 1200);
      if (glideFrom) {
        o.frequency.setValueAtTime(glideFrom * Math.pow(2, cents / 1200), t);
        o.frequency.exponentialRampToValueAtTime(base, t + Math.min(0.08, dur * 0.4));
      } else o.frequency.setValueAtTime(base, t);
      const lg = ctx.createGain(); lg.gain.value = lvl;
      o.connect(lg); lg.connect(f);
      o.start(t); o.stop(t + dur + 0.4);
    }

    const [a, d, s, r] = amp;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + a);
    g.gain.linearRampToValueAtTime(gain * s, t + a + d);
    g.gain.setValueAtTime(gain * s, t + Math.max(a + d, dur));
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(a + d, dur) + r);
  }

  // Percussion, because rhythm is what stops four seconds feeling like a slideshow.
  function kick(t, v = 1) {
    const g = chan(0, 0.05);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(165, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    o.connect(g); o.start(t); o.stop(t + 0.4);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.5 * v, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  }
  function tick(t, v = 1, pan = 0) {
    const g = chan(pan, 0.3);
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5200; hp.Q.value = 0.8;
    n.connect(hp); hp.connect(g); n.start(t, rnd() * 0.5); n.stop(t + 0.14);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.055 * v, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  }
  // Woody doubling that keeps a thread back to the badge kit's marimba.
  function wood(t, note, v = 1, pan = 0) {
    const g = chan(pan, 0.3), f = N(note);
    [[1, 0.5], [4, 0.1], [9.9, 0.035]].forEach(([m, lvl], i) => {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f * m, t);
      const lg = ctx.createGain(); lg.gain.value = lvl;
      o.connect(lg); lg.connect(g); o.start(t); o.stop(t + (i ? 0.16 : 0.75));
    });
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.3 * v, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  }

  // --- the instruments -----------------------------------------------------
  const BASS = { waves: [['sawtooth', 0, 1], ['square', -1200, 0.55]], cutoff: [260, 1100, 320],
                 q: 7, amp: [0.006, 0.09, 0.55, 0.18], gain: 0.30, send: 0.05 };
  const STAB = { waves: [['square', -6, 0.6], ['square', 6, 0.6], ['sawtooth', 0, 0.35]],
                 cutoff: [700, 5200, 900], q: 5, amp: [0.004, 0.07, 0.25, 0.20], gain: 0.105, send: 0.3 };
  const LEAD = { waves: [['square', -5, 0.55], ['triangle', 5, 0.9]], cutoff: [900, 7000, 1600],
                 q: 3.5, amp: [0.006, 0.05, 0.75, 0.22], gain: 0.125, send: 0.35 };
  const SHINE = { waves: [['triangle', 0, 1], ['sine', 1200, 0.3]], cutoff: [2500, 9000, 3000],
                  q: 2, amp: [0.004, 0.10, 0.4, 0.8], gain: 0.085, send: 0.6 };

  return {
    bass: (t, n, d, o = {}) => play(t, N(n), d, { ...BASS, ...o }),
    // Chord tones spread hard across the image. Bass, kick and lead stay centred,
    // so without this the whole sting collapses to mono — measured at 0.988
    // correlation before the spread was widened.
    stab: (t, notes, d, o = {}) => notes.forEach((n, i) =>
      play(t + i * 0.006, N(n), d, { ...STAB, pan: -0.62 + i * 0.62, ...o })),
    lead: (t, n, d, o = {}) => play(t, N(n), d, { ...LEAD, ...o }),
    shine: (t, n, d, o = {}) => play(t, N(n), d, { ...SHINE, ...o }),
    kick, tick, wood,
  };
}

// ---------------------------------------------------------------------------
// The arrangement. 154 BPM, a beat every 0.39 s, with beat one landing on the
// takeoff at 0.68 s and the cadence resolving on the wordmark at 1.85 s.
//
//   0.45  pickup run, under the crouch
//   0.68  C   — he leaves the ground
//   1.07  F   — the climb
//   1.46  G   — the hang, deceleration
//   1.85  C   — the wordmark, and the tune lands home
//
// I–IV–V–I: the oldest heroic cadence there is, and the reason this reads as
// an arrival instead of a pile of taps.
// ---------------------------------------------------------------------------
function arrange(E) {
  const CH = { C: [C4, E4, G4], F: [C4, F4, A4], G: [B3, D4, G4] };

  // -- pickup: three quick notes winding up, the only falling-to-rising moment
  E.lead(0.45, G4, 0.07, { gain: 0.07 });
  E.lead(0.52, A4, 0.07, { gain: 0.08 });
  E.lead(0.59, B4, 0.09, { gain: 0.095 });
  E.tick(0.52, 0.5, -0.3); E.tick(0.59, 0.6, 0.3);
  E.wood(0.45, C3, 0.5, -0.1);

  // -- 0.68  TAKEOFF. Full weight: kick, bass, chord stab, lead hitting the tonic.
  E.kick(0.68, 1.0);
  E.bass(0.68, C2, 0.36);
  E.stab(0.68, CH.C, 0.30);
  E.lead(0.68, C5, 0.30, { gain: 0.14, glideFrom: N(G4) });
  E.wood(0.68, C5, 0.9, 0);
  E.tick(0.68, 1.0, 0);

  // the melody climbing with him — this is the hook, and it is meant to be hummable
  E.lead(0.875, E5, 0.17);
  E.lead(0.975, G5, 0.19);

  // -- 1.07  F. He is rising; the chord lifts under the melody's peak.
  E.kick(1.07, 0.6);
  E.bass(1.07, F2, 0.34);
  E.stab(1.07, CH.F, 0.28);
  E.lead(1.07, C6, 0.30, { gain: 0.145 });     // top of the phrase
  E.wood(1.07, C6, 0.7, 0.15);
  E.tick(1.26, 0.5, 0.35);
  E.lead(1.27, A5, 0.17);

  // -- 1.46  G. The hang at the top, the melody easing down before it resolves.
  E.kick(1.46, 0.55);
  E.bass(1.46, G2, 0.34);
  E.stab(1.46, CH.G, 0.28);
  E.lead(1.46, G5, 0.22);
  E.lead(1.66, F5, 0.09);
  E.lead(1.755, E5, 0.09);
  E.tick(1.655, 0.45, -0.35);

  // -- 1.85  HOME. The wordmark. Everything arrives together on C, the melody an
  // octave up, with a shine on top that rings past the end of the picture.
  E.kick(1.85, 1.0);
  E.bass(1.85, C2, 0.7, { gain: 0.33 });
  E.stab(1.85, [C4, E4, G4], 0.55, { gain: 0.12, amp: [0.005, 0.1, 0.35, 0.5] });
  E.lead(1.85, C6, 0.6, { gain: 0.15, glideFrom: N(G5) });
  E.wood(1.85, C6, 1.0, 0);
  E.shine(1.87, E6, 1.1, { pan: 0.6 });
  E.shine(1.95, G6, 1.0, { pan: -0.55, gain: 0.06 });
  E.tick(1.85, 1.0, 0);

  // -- tail: two bright flecks as the sparkles land, then let the room carry it out
  E.shine(2.30, C7, 0.9, { pan: -0.45, gain: 0.05 });
  E.shine(2.40, E7, 0.8, { pan: 0.45, gain: 0.04 });
  E.lead(2.30, G5, 0.5, { gain: 0.05, amp: [0.02, 0.2, 0.3, 0.7] });
}

// ---------------------------------------------------------------------------
// Haptics — cut to the MUSIC, not to the picture. The body should feel the
// downbeats, because that is what the ear is already following.
// ---------------------------------------------------------------------------
const HAPTICS = [
  { t: 0.52, type: 'transient', i: 0.14, s: 0.5 },                               // pickup
  { t: 0.59, type: 'transient', i: 0.18, s: 0.55 },
  { t: 0.68, type: 'continuous', d: 0.16, i: 0.8, s: 0.45, ramp: [1, 0.2] },     // takeoff weight
  { t: 0.68, type: 'transient', i: 0.95, s: 0.7 },
  { t: 1.07, type: 'transient', i: 0.5, s: 0.5 },                                // the IV
  { t: 1.46, type: 'transient', i: 0.45, s: 0.5 },                               // the V
  { t: 1.85, type: 'transient', i: 0.9, s: 0.75 },                               // home
  { t: 1.85, type: 'continuous', d: 0.4, i: 0.35, s: 0.5, ramp: [1, 0.1] },
  { t: 2.30, type: 'transient', i: 0.18, s: 1.0 },
  { t: 2.40, type: 'transient', i: 0.14, s: 1.0 },
];

// ---------------------------------------------------------------------------
window.renderAudio = async (dur = 4.2, sr = 48000) => {
  const ctx = new OfflineAudioContext(2, Math.ceil(dur * sr), sr);
  arrange(createEngine(ctx));
  const buf = await ctx.startRendering();
  const n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1);
  const bytes = new Uint8Array(44 + n * 4), dv = new DataView(bytes.buffer);
  const str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, n * 4, true);
  const clip = x => Math.max(-1, Math.min(1, x));
  for (let i = 0; i < n; i++) {
    dv.setInt16(44 + i * 4, clip(L[i]) * 32767, true);
    dv.setInt16(46 + i * 4, clip(R[i]) * 32767, true);
  }
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

window.haptics = (audioFile) => {
  const P = (id, v) => ({ ParameterID: id, ParameterValue: +v.toFixed(3) });
  const pattern = [];
  if (audioFile) pattern.push({ Event: { Time: 0, EventType: 'AudioCustom', EventWaveformPath: audioFile, EventParameters: [P('AudioVolume', 1)] } });
  for (const e of HAPTICS) {
    if (e.type === 'transient') pattern.push({ Event: { Time: e.t, EventType: 'HapticTransient', EventParameters: [P('HapticIntensity', e.i), P('HapticSharpness', e.s)] } });
    else {
      pattern.push({ Event: { Time: e.t, EventType: 'HapticContinuous', EventDuration: e.d, EventParameters: [P('HapticIntensity', e.i), P('HapticSharpness', e.s)] } });
      if (e.ramp) pattern.push({ ParameterCurve: { ParameterID: 'HapticIntensityControl', Time: e.t, ParameterCurveControlPoints: [{ Time: 0, ParameterValue: e.ramp[0] }, { Time: e.d, ParameterValue: e.ramp[1] }] } });
    }
  }
  const step = 10, end = 2.6;
  const amp = new Array(Math.ceil(end * 1000 / step)).fill(0);
  const lerp = (a, b, k) => a + (b - a) * k;
  for (const e of HAPTICS) {
    const i0 = Math.round(e.t * 1000 / step);
    if (e.type === 'transient') {
      const len = Math.max(1, Math.round(lerp(40, 12, e.s) / step));
      for (let i = 0; i < len; i++) amp[i0 + i] = Math.max(amp[i0 + i] || 0, Math.round(e.i * 255));
    } else {
      const len = Math.round(e.d * 1000 / step), [r0, r1] = e.ramp || [1, 1];
      for (let i = 0; i < len; i++) amp[i0 + i] = Math.max(amp[i0 + i] || 0, Math.round(e.i * lerp(r0, r1, i / len) * 255));
    }
  }
  const timings = [], amplitudes = [];
  for (const a of amp) {
    if (amplitudes.length && amplitudes[amplitudes.length - 1] === a) timings[timings.length - 1] += step;
    else { timings.push(step); amplitudes.push(a); }
  }
  return {
    events: HAPTICS,
    ahap: { Version: 1.0, Metadata: { Project: 'Twist Hero Theme', Created: 'score in hero_theme.html' }, Pattern: pattern },
    android: { timings, amplitudes },
  };
};

document.getElementById('play').onclick = () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const E = createEngine(ctx);
  const t0 = ctx.currentTime + 0.08;
  const shift = fn => (t, ...a) => fn(t0 + t, ...a);
  arrange(Object.fromEntries(Object.entries(E).map(([k, v]) => [k, shift(v)])));
  document.getElementById('log').textContent =
    '154 BPM  ·  I–IV–V–I in C\n0.68 C (takeoff)  1.07 F  1.46 G  1.85 C (wordmark)';
};
</script>
</body>
